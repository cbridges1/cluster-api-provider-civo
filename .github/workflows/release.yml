# Builds the manager image on every push; on a v* tag also publishes the
# clusterctl/Turtles release artifacts (infrastructure-components.yaml,
# metadata.yaml) to the GitHub release.
name: release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go test ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cluster-api-provider-civo
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pip install pyyaml
          python3 hack/components.py ghcr.io/${{ github.repository_owner }}/cluster-api-provider-civo:${GITHUB_REF_NAME}
          gh release create "$GITHUB_REF_NAME" out/infrastructure-components.yaml out/metadata.yaml --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
