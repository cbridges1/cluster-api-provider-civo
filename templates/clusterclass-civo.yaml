# A ClusterClass for Civo managed Kubernetes (K3s or Talos). Each release
# publishes it as clusterclass-civo.yaml, beside infrastructure-components.yaml,
# where clusterctl finds it. It has no namespace: install it where its
# Clusters (or what builds them) refer to it.
#
# The provider reads its API key from a Secret (default civo-credentials,
# key token) in the *cluster's* namespace. A Cluster's topology version is
# matched to Civo's labels by the provider (or set civoVersion).
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: civo
spec:
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: CivoClusterTemplate
      name: civo
  controlPlane:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: CivoControlPlaneTemplate
      name: civo
  variables:
    - name: region
      required: false
      schema:
        openAPIV3Schema: {type: string, default: LON1, description: Civo region.}
    - name: credentialsSecret
      required: false
      schema:
        openAPIV3Schema: {type: string, default: civo-credentials}
    - name: networkID
      required: false
      schema:
        openAPIV3Schema: {type: string, default: "", description: Civo network; empty is the region's default.}
    - name: clusterType
      required: false
      schema:
        openAPIV3Schema: {type: string, enum: [k3s, talos], default: k3s}
    - name: civoVersion
      required: false
      schema:
        openAPIV3Schema: {type: string, default: "", description: Exact Civo version label; empty matches the Kubernetes version.}
    - name: cniPlugin
      required: false
      schema:
        openAPIV3Schema: {type: string, enum: [flannel, cilium], default: flannel}
    - name: nodeSize
      required: false
      schema:
        openAPIV3Schema: {type: string, default: g4s.kube.medium}
    - name: nodeCount
      required: false
      schema:
        openAPIV3Schema: {type: integer, minimum: 1, default: 3}
    - name: disableTraefik
      required: false
      schema:
        openAPIV3Schema: {type: boolean, default: false}
    - name: disableMetricsServer
      required: false
      schema:
        openAPIV3Schema: {type: boolean, default: false}
    - name: firewallID
      required: false
      schema:
        openAPIV3Schema: {type: string, default: "", description: "An existing Civo firewall to use (kept when the cluster is deleted); empty has Civo create one, open on 80, 443 and 6443 only, and deleted with the cluster."}
    - name: firewallRules
      required: false
      schema:
        openAPIV3Schema:
          type: array
          default: []
          description: Ingress rules the provider adds to the cluster's firewall, beside Civo's 80, 443 and 6443, and removes with it. Needs cluster-api-provider-civo v0.2.0 or later.
          items:
            type: object
            required: [protocol, port]
            properties:
              protocol: {type: string, enum: [tcp, udp]}
              port: {type: integer, minimum: 1, maximum: 65535}
              endPort: {type: integer, minimum: 1, maximum: 65535, description: The last port of a range.}
              cidrs: {type: array, items: {type: string}, description: Empty is everywhere (0.0.0.0/0).}
  patches:
    - name: civo-cluster
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: CivoClusterTemplate
            matchResources: {infrastructureCluster: true}
          jsonPatches:
            - {op: replace, path: /spec/template/spec/region, valueFrom: {variable: region}}
            - {op: replace, path: /spec/template/spec/credentialsRef/name, valueFrom: {variable: credentialsSecret}}
            - {op: replace, path: /spec/template/spec/networkID, valueFrom: {variable: networkID}}
    - name: civo-control-plane
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: CivoControlPlaneTemplate
            matchResources: {controlPlane: true}
          jsonPatches:
            - {op: replace, path: /spec/template/spec/clusterType, valueFrom: {variable: clusterType}}
            - {op: replace, path: /spec/template/spec/civoVersion, valueFrom: {variable: civoVersion}}
            - {op: replace, path: /spec/template/spec/cniPlugin, valueFrom: {variable: cniPlugin}}
            - {op: replace, path: /spec/template/spec/nodeSize, valueFrom: {variable: nodeSize}}
            - {op: replace, path: /spec/template/spec/nodeCount, valueFrom: {variable: nodeCount}}
            - {op: replace, path: /spec/template/spec/disableTraefik, valueFrom: {variable: disableTraefik}}
            - {op: replace, path: /spec/template/spec/disableMetricsServer, valueFrom: {variable: disableMetricsServer}}
    # Only when set, so clusters that don't use it see no change.
    - name: civo-firewall
      enabledIf: '{{ if .firewallID }}true{{ end }}'
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: CivoControlPlaneTemplate
            matchResources: {controlPlane: true}
          jsonPatches:
            - {op: add, path: /spec/template/spec/firewallID, valueFrom: {variable: firewallID}}
    - name: civo-firewall-rules
      enabledIf: '{{ if .firewallRules }}true{{ end }}'
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: CivoControlPlaneTemplate
            matchResources: {controlPlane: true}
          jsonPatches:
            - {op: add, path: /spec/template/spec/firewallRules, valueFrom: {variable: firewallRules}}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: CivoClusterTemplate
metadata:
  name: civo
spec:
  template:
    spec:
      region: LON1
      networkID: ""
      credentialsRef: {name: civo-credentials}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: CivoControlPlaneTemplate
metadata:
  name: civo
spec:
  template:
    spec:
      clusterType: k3s
      civoVersion: ""
      cniPlugin: flannel
      nodeSize: g4s.kube.medium
      nodeCount: 3
      disableTraefik: false
      disableMetricsServer: false
