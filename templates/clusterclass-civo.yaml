# A ClusterClass for Civo managed Kubernetes (K3s or Talos). Each release
# publishes it as clusterclass-civo.yaml, beside infrastructure-components.yaml,
# where clusterctl finds it. It has no namespace: install it where its
# Clusters (or what builds them) refer to it.
#
# The provider reads its API key from a Secret (default civo-credentials,
# key token) in the *cluster's* namespace. A Cluster's topology version is
# matched to Civo's labels by the provider (or set civoVersion).
#
# Nodes are machine pools (Civo node pools), as for EKS and AKS: list them
# in the Cluster's topology (workers.machinePools, class default) and scale
# them by their replicas. One without replicas keeps the nodes it has (an
# adopted cluster's). nodeSize sets their size; a pool's own variables
# override it. Needs cluster-api-provider-civo v0.4.0 or later.
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: civo
spec:
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: CivoClusterTemplate
      name: civo
  controlPlane:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: CivoControlPlaneTemplate
      name: civo
  workers:
    machinePools:
      - class: default
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1alpha1
            kind: CivoConfigTemplate
            name: civo
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: CivoMachinePoolTemplate
            name: civo
  variables:
    - name: region
      required: false
      schema:
        openAPIV3Schema: {type: string, default: LON1, description: Civo region.}
    - name: credentialsSecret
      required: false
      schema:
        openAPIV3Schema: {type: string, default: civo-credentials}
    - name: networkID
      required: false
      schema:
        openAPIV3Schema: {type: string, default: "", description: Civo network; empty is the region's default.}
    - name: clusterType
      required: false
      schema:
        openAPIV3Schema: {type: string, enum: [k3s, talos], default: k3s}
    - name: civoVersion
      required: false
      schema:
        openAPIV3Schema: {type: string, default: "", description: Exact Civo version label; empty matches the Kubernetes version.}
    - name: cniPlugin
      required: false
      schema:
        openAPIV3Schema: {type: string, enum: [flannel, cilium], default: flannel}
    - name: nodeSize
      required: false
      schema:
        openAPIV3Schema: {type: string, default: g4s.kube.medium, description: "Node instance size; a machine pool's variables can override it. Civo can't resize a pool: a new size takes a new pool."}
    - name: nodeCount
      required: false
      schema:
        openAPIV3Schema: {type: integer, minimum: 1, description: "Only for a Cluster with no machine pools (made before v0.4.0): its pool's node count. Otherwise ignored: scale a machine pool's replicas."}
    - name: disableTraefik
      required: false
      schema:
        openAPIV3Schema: {type: boolean, default: false}
    - name: disableMetricsServer
      required: false
      schema:
        openAPIV3Schema: {type: boolean, default: false}
    - name: firewallID
      required: false
      schema:
        openAPIV3Schema: {type: string, default: "", description: "An existing Civo firewall to use (kept when the cluster is deleted); empty has Civo create one, open on 80, 443 and 6443 only, and deleted with the cluster."}
    - name: firewallRules
      required: false
      schema:
        openAPIV3Schema:
          type: array
          default: []
          description: Ingress rules the provider adds to the cluster's firewall, beside Civo's 80, 443 and 6443, and removes with it. Needs cluster-api-provider-civo v0.2.0 or later.
          items:
            type: object
            required: [protocol, port]
            properties:
              protocol: {type: string, enum: [tcp, udp]}
              port: {type: integer, minimum: 1, maximum: 65535}
              endPort: {type: integer, minimum: 1, maximum: 65535, description: The last port of a range.}
              cidrs: {type: array, items: {type: string}, description: Empty is everywhere (0.0.0.0/0).}
    - name: clusterID
      required: false
      schema:
        openAPIV3Schema: {type: string, description: "Adopts the existing Civo cluster with this ID instead of creating one; its name can differ from the Cluster's. Needs cluster-api-provider-civo v0.3.0 or later."}
    - name: deletionPolicy
      required: false
      schema:
        openAPIV3Schema: {type: string, enum: [Delete, Retain], description: "What deleting the Cluster does to the Civo cluster: Delete (the default) removes it, its volumes and the firewall Civo made for it; Retain leaves them. Needs v0.3.0 or later."}
  patches:
    - name: civo-cluster
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: CivoClusterTemplate
            matchResources: {infrastructureCluster: true}
          jsonPatches:
            - {op: replace, path: /spec/template/spec/region, valueFrom: {variable: region}}
            - {op: replace, path: /spec/template/spec/credentialsRef/name, valueFrom: {variable: credentialsSecret}}
            - {op: replace, path: /spec/template/spec/networkID, valueFrom: {variable: networkID}}
    - name: civo-control-plane
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: CivoControlPlaneTemplate
            matchResources: {controlPlane: true}
          jsonPatches:
            - {op: replace, path: /spec/template/spec/clusterType, valueFrom: {variable: clusterType}}
            - {op: replace, path: /spec/template/spec/civoVersion, valueFrom: {variable: civoVersion}}
            - {op: replace, path: /spec/template/spec/cniPlugin, valueFrom: {variable: cniPlugin}}
            - {op: replace, path: /spec/template/spec/nodeSize, valueFrom: {variable: nodeSize}}
            - {op: replace, path: /spec/template/spec/disableTraefik, valueFrom: {variable: disableTraefik}}
            - {op: replace, path: /spec/template/spec/disableMetricsServer, valueFrom: {variable: disableMetricsServer}}
    - name: civo-node-count
      enabledIf: '{{ if .nodeCount }}true{{ end }}'
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: CivoControlPlaneTemplate
            matchResources: {controlPlane: true}
          jsonPatches:
            - {op: replace, path: /spec/template/spec/nodeCount, valueFrom: {variable: nodeCount}}
    - name: civo-adopt
      enabledIf: '{{ if .clusterID }}true{{ end }}'
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: CivoControlPlaneTemplate
            matchResources: {controlPlane: true}
          jsonPatches:
            - {op: add, path: /spec/template/spec/clusterID, valueFrom: {variable: clusterID}}
    - name: civo-deletion-policy
      enabledIf: '{{ if .deletionPolicy }}true{{ end }}'
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: CivoControlPlaneTemplate
            matchResources: {controlPlane: true}
          jsonPatches:
            - {op: add, path: /spec/template/spec/deletionPolicy, valueFrom: {variable: deletionPolicy}}
    - name: civo-pool-size
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: CivoMachinePoolTemplate
            matchResources: {machinePoolClass: {names: [default]}}
          jsonPatches:
            - {op: replace, path: /spec/template/spec/size, valueFrom: {variable: nodeSize}}
    # Only when set, so clusters that don't use it see no change.
    - name: civo-firewall
      enabledIf: '{{ if .firewallID }}true{{ end }}'
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: CivoControlPlaneTemplate
            matchResources: {controlPlane: true}
          jsonPatches:
            - {op: add, path: /spec/template/spec/firewallID, valueFrom: {variable: firewallID}}
    - name: civo-firewall-rules
      enabledIf: '{{ if .firewallRules }}true{{ end }}'
      definitions:
        - selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: CivoControlPlaneTemplate
            matchResources: {controlPlane: true}
          jsonPatches:
            - {op: add, path: /spec/template/spec/firewallRules, valueFrom: {variable: firewallRules}}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: CivoClusterTemplate
metadata:
  name: civo
spec:
  template:
    spec:
      region: LON1
      networkID: ""
      credentialsRef: {name: civo-credentials}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: CivoControlPlaneTemplate
metadata:
  name: civo
spec:
  template:
    spec:
      clusterType: k3s
      civoVersion: ""
      cniPlugin: flannel
      nodeSize: g4s.kube.medium
      disableTraefik: false
      disableMetricsServer: false
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: CivoMachinePoolTemplate
metadata:
  name: civo
spec:
  template:
    spec:
      size: g4s.kube.medium
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha1
kind: CivoConfigTemplate
metadata:
  name: civo
spec:
  template: {}
