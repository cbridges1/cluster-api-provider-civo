              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CivoMachinePoolSpec is a node pool of a Civo managed cluster: Cluster
              API's InfraMachinePool, as AWSManagedMachinePool is for EKS and
              AzureManagedMachinePool for AKS. Its MachinePool's replicas are the
              pool's node count.
            properties:
              labels:
                additionalProperties:
                  type: string
                description: labels are put on the pool's nodes when it's made.
                type: object
              poolID:
                description: |-
                  poolID adopts this existing pool of the cluster. Unset, the pool
                  is the one the provider made for it, or (on a cluster that was
                  adopted or made before machine pools) one of the cluster's pools
                  no other CivoMachinePool has.
                type: string
                x-kubernetes-validations:
                - message: poolID can't be changed
                  rule: self == oldSelf
              providerIDList:
                description: |-
                  providerIDList is the pool's nodes (civo://INSTANCE-ID). Set by the
                  provider.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              publicIPNodePool:
                description: publicIPNodePool gives the pool's nodes public IPs.
                type: boolean
              size:
                default: g4s.kube.medium
                description: |-
                  size is the nodes' instance size (e.g. g4s.kube.medium). Civo can't
                  change a pool's size: a different size takes a new pool.
                type: string
              taints:
                description: taints are put on the pool's nodes when it's made.
                items:
                  description: |-
                    The node this Taint is attached to has the "effect" on
                    any pod that does not tolerate the Taint.
                  properties:
                    effect:
                      description: |-
                        Required. The effect of the taint on pods
                        that do not tolerate the taint.
                        Valid effects are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: Required. The taint key to be applied to a node.
                      type: string
                    timeAdded:
                      description: TimeAdded represents the time at which the taint
                        was added.
                      format: date-time
                      type: string
                    value:
                      description: The taint value corresponding to the taint key.
                      type: string
                  required:
                  - effect
                  - key
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
