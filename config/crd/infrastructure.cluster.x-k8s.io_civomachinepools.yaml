                minProperties: 1
                properties:
                  provisioned:
                    description: provisioned is true once the pool exists.
                    type: boolean
                type: object
              poolID:
                description: poolID is the Civo pool's ID.
                type: string
              replicas:
                description: replicas is the pool's node count, as Civo last reported
                  it.
                format: int32
                type: integer
              size:
                description: size is the pool's instance size, as Civo reports it.
                type: string
            type: object
